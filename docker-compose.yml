# 云栖 PMS · MySQL 8.4 数据库（仅数据库服务；后端 uvicorn / 前端 vite 仍在本地跑）
#
#   启动：docker compose up -d        # 等 `docker compose ps` 显示 healthy
#   停止：docker compose down         # 数据保留在 named volume mysql-data 里
#   清库：docker compose down -v      # 连数据卷一起删，下次启动后端重新种子
#
# 后端连接串在 backend/.env：
#   YUNQI_DATABASE_URL=mysql+pymysql://yunqi:yunqi123456@127.0.0.1:3306/yunqi_pms?charset=utf8mb4
# 若本机 3306 已被占用：把 ports 改成 "3307:3306"，并同步改 .env 里的端口。

services:
  mysql:
    image: mysql:8.4
    container_name: yunqi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: yunqi123456
      MYSQL_DATABASE: yunqi_pms
      MYSQL_USER: yunqi
      MYSQL_PASSWORD: yunqi123456
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

volumes:
  mysql-data:
