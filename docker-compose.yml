# 云栖 PMS · 全栈部署（MySQL 8.4 + FastAPI 后端 + nginx 前端）
#
#   部署：docker compose up -d --build   # 首次部署与更新代码后都跑这条；等 `docker compose ps` 全部 healthy
#   访问：http://<服务器IP>:8080          # nginx 统一入口，/api 同源反代到 backend:8000
#   停止：docker compose down            # 数据保留在 named volume mysql-data 里
#   清库：docker compose down -v         # 连数据卷一起删，下次启动重新种子（改库名/账号后必须 -v 重建卷）
#
# 本地开发（后端 uvicorn / 前端 vite 仍在宿主机跑）：
#   docker compose up -d mysql           # 只起数据库，backend/.env 连 127.0.0.1:3306
#
# 生产必须覆盖的变量（写在本文件同目录的 .env 里，compose 自动读取并注入容器/构建）：
#   JWT_SECRET=<强随机值>                # 有 dev 默认值，生产必须换
#   DATA_SECRET_KEY=<强随机值>           # 证件号加密密钥：一旦有数据上盘，此后【不可更换】（换钥=密文全废）
#   ADMIN_PASSWORD=<初始密码>            # seed 的 admin 账号初始密码，缺省 123456（仅首次建库生效）
#   DEMO_ACCOUNTS=off                    # 缺省 on；off 时演示员工账号建成停用态（生产推荐）
#   CAPTCHA=on                           # 缺省 on；本地演示/自动化可临时 off
#   PMS_PORT=8080                        # 门户端口
#   MYSQL_ROOT_PASSWORD=<强随机值>       # root 初始密码，缺省演示值（仅首次建卷生效）
#   DB_USER/DB_PASSWORD/DB_NAME          # 与 mysql 服务的建库账号同源；首次建卷后改值需 down -v
#   PIP_INDEX_URL / NPM_REGISTRY         # 构建期依赖源（国内服务器可换清华源/npmmirror 加速）
#   VITE_DEMO_HINT=off                   # 缺省 on；off 时登录页不显示演示账号提示（随前端构建固化）

services:
  mysql:
    image: mysql:8.4
    container_name: pms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pms123456}
      MYSQL_DATABASE: ${DB_NAME:-pms}
      MYSQL_USER: ${DB_USER:-pms}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pms123456}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"          # 只绑本机回环：本地开发连得上，服务器上不暴露公网
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: pms-backend
    restart: unless-stopped
    environment:
      DB_ENGINE: mysql
      DB_HOST: mysql                   # compose 网络里的数据库服务名
      DB_PORT: 3306
      DB_USER: ${DB_USER:-pms}
      DB_PASSWORD: ${DB_PASSWORD:-pms123456}
      DB_NAME: ${DB_NAME:-pms}
      JWT_SECRET: ${JWT_SECRET:-pms-dev-secret-2026}
      DATA_SECRET_KEY: ${DATA_SECRET_KEY:-pms-dev-data-key-2026}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123456}
      DEMO_ACCOUNTS: ${DEMO_ACCOUNTS:-on}
      CAPTCHA: ${CAPTCHA:-on}
      TZ: Asia/Shanghai                # 后端 datetime.now() 的「今天」按本地时区，容器缺省 UTC 会错位
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s                # lifespan 建表/迁移/种子需要几秒
    # 调试需从宿主机直连后端时，临时放开：
    # ports:
    #   - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        VITE_DEMO_HINT: ${VITE_DEMO_HINT:-on}
    container_name: pms-frontend
    restart: unless-stopped
    ports:
      - "${PMS_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
