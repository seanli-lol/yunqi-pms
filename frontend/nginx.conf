# 云栖 PMS 前端入口：静态 SPA + /api 同源反代（backend 为 compose 服务名）
server {
    listen 80;
    server_name _;

    # 仅信任同机反代（Docker 内网 Caddy）与 Cloudflare 边缘节点透传的真实客户端 IP
    # 直连源站 IP 时忽略该头，防止伪造绕过限流
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    # 官方 IP 段：https://www.cloudflare.com/ips-v4 与 https://www.cloudflare.com/ips-v6
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # vite 带 hash 的构建产物：长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API 反代：变量式 proxy_pass + docker 内嵌 DNS，后端容器重启换 IP 也不会 502
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # 覆写而非追加：防伪造，uvicorn --proxy-headers 按它还原真实客户端 IP
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # React Router SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
