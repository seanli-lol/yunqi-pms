# 云栖 PMS 前端入口：静态 SPA + /api 同源反代（backend 为 compose 服务名）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # vite 带 hash 的构建产物：长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API 反代：变量式 proxy_pass + docker 内嵌 DNS，后端容器重启换 IP 也不会 502
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # 覆写而非追加：防伪造，uvicorn --proxy-headers 按它还原真实客户端 IP
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # React Router SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
